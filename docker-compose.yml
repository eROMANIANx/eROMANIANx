version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: learner
      POSTGRES_PASSWORD: learner
      POSTGRES_DB: learneum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://learner:learner@db:5432/learneum
      JWT_SECRET: dev-secret-change-me
      PORT: 4000
    depends_on:
      - db
    ports:
      - "4000:4000"

  admin:
    build: ./apps/admin
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  pgdata:
